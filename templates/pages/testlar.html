{% extends "base.html" %}
{% block title %} Bosh sahifa {% endblock %}
{% block content %}
{% load static %}


<div class="site-section" style="background: url({% static 'images/back.png' %}) no-repeat center / cover">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 mb-4">
                <div class="row">
                    {% for manba in testlar %}
                <div class="col-lg-3 mt-4">
                    <div style="height: 300px; border-radius: 20px; box-shadow: 0 0 10px 1px rgba(58,12,163, 0.3)" class="card my-3 text-center p-2">
                        {% if manba.image %}
                        <img class="mx-auto pt-2" width="100" height="100" src="{{ manba.image.url }}" alt="">
                        {% endif %}
                        <h5 class="card-title text-siyoh mt-2">{{ manba.title }}</h5>
                        <small>{{ manba.category }}</small>
                        <div class="card-body m-0 p-0 d-flex flex-column justify-content-center align-items-center">
                            <p class="text-siyoh">O'tish bali: {{ manba.min_percentage }}%</p>
                            <a class="btn bg-siyoh text-light" href="{% url 'inclusive_app:test_detail' manba.id %}" target="_blank">Boshlash</a>

                        </div>
                    </div>
                </div>
                {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
